<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f5">
  <meta name="description" content="VALUNARIA. Clarity for the agentic web.">
  <title>VALUNARIA — Clarity for the agentic web</title>
  <style>
    :root{color-scheme:light;--ink:#202725;--muted:#737b78;--line:#dbdfda;--bg:#f8f8f5}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    .page{width:min(100% - 64px,1120px);min-height:100svh;margin:auto;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;padding:42px 0;border-bottom:1px solid var(--line)}
    .brand{font-size:17px;font-weight:650;letter-spacing:.26em;text-decoration:none;color:var(--ink)}
    .top{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:90px 0 110px;max-width:760px}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.22em;color:#677f75;margin:0 0 28px}
    h1{font-size:clamp(48px,8vw,98px);font-weight:450;letter-spacing:-.068em;line-height:1.02;margin:0 0 32px}
    p.lead{font-size:clamp(17px,2.2vw,22px);line-height:1.6;max-width:520px;color:#5a6460;margin:0}
    .cta{display:inline-flex;align-items:center;gap:24px;align-self:start;margin-top:52px;padding:15px 0;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;letter-spacing:.08em;border-bottom:1px solid var(--ink)}
    .cta:hover{gap:34px}.arrow{font-size:19px;font-weight:400}
    footer{display:flex;justify-content:space-between;gap:16px;padding:27px 0 32px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    footer a{color:inherit;text-decoration:none}footer a:hover{text-decoration:underline}
    @media(max-width:560px){.page{width:calc(100% - 40px)}header{padding:29px 0}.brand{font-size:14px}.top{font-size:10px}main{padding:80px 0}footer{flex-direction:column;gap:8px}}
  </style>
</head>
<body><div class="page">
<header><a class="brand" href="/">VALUNARIA</a><span class="top">Web intelligence</span></header>
<main>
  <p class="eyebrow">Made for autonomous intelligence</p>
  <h1>Clarity for<br>the agentic web.</h1>
  <p class="lead">The web is vast. What matters should be within reach.<br>VALUNARIA brings structure to information, so intelligent systems can move forward.</p>
  <a class="cta" href="mailto:info@valunaria.com?subject=VALUNARIA%20inquiry">GET IN TOUCH <span class="arrow" aria-hidden="true">↗</span></a>
</main>
<footer><span>© 2026 VALUNARIA</span><a href="mailto:info@valunaria.com">info@valunaria.com</a></footer>
</div></body></html>
